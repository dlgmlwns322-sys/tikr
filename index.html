<style>
/* v9 규칙 — 글자 11/12.5/14/16/22/30 · 굵기 400/600/700 · 여백 4px 격자(화면16·패널14/12·섹션20·제목→패널8) · radius 14/10/6 */
:root{--bg:#EEF1F6;--panel:#fff;--line:#E5E8EE;--div:#F0F2F6;--t1:#111827;--t2:#6B7280;--t3:#9CA3AF;
--acc:#4F46E5;--acc-bg:#EEF0FF;--up:#DC2626;--dn:#2563EB;--warn:#92400E;--warn-bg:#FEF3C7;
--f1:11px;--f2:12.5px;--f3:14px;--f4:16px;--f5:22px;--f6:30px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body[data-detail] #app{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.body{padding:0 16px 20px}
.num{font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--t2)}

/* 헤더 */
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 16px 12px}
.hd h1{font-size:var(--f5);font-weight:700;letter-spacing:-.02em}.hd p{font-size:var(--f1);color:var(--t3);margin-top:2px;min-height:14px}
.acts{display:flex;gap:2px;flex-shrink:0;margin-top:4px}
.hbtn{background:none;border:0;font-size:var(--f2);color:var(--t2);padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.hbtn:active{background:#E3E7EE}
.nav{display:flex;align-items:center;gap:6px;padding:calc(20px + env(safe-area-inset-top)) 12px 12px}
.nav .back{display:flex;align-items:center;background:none;border:0;padding:2px;cursor:pointer;color:var(--t1);flex-shrink:0}
.nav .tt{display:flex;align-items:baseline;gap:6px;min-width:0}
.nav b{font-size:var(--f4);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .tt span{font-size:var(--f1);color:var(--t3);white-space:nowrap}
.nav .acts{margin:0 0 0 auto}
/* 시장 탭 */
.tabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;font-size:var(--f3);color:var(--t3);padding:8px 0 10px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs .on{color:var(--t1);font-weight:700;border-color:var(--t1)}
/* 기간 세그먼트 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#E3E7EE;border-radius:10px;padding:3px;margin-top:16px}
.seg button{background:none;border:0;text-align:center;font-size:var(--f2);color:var(--t2);padding:7px 0;border-radius:8px;cursor:pointer}
.seg .on{background:#fff;color:var(--t1);font-weight:700;box-shadow:0 1px 2px rgba(17,24,39,.08)}
/* 섹션 제목 */
.lead{font-size:var(--f4);font-weight:700;line-height:1.5;margin-top:20px;word-break:keep-all}.leads{font-size:var(--f2);color:var(--t2);margin-top:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 8px}.sec b{font-size:var(--f2);font-weight:600;color:var(--t2)}.sec span,.sec button{font-size:var(--f1);color:var(--t3)}
.sec button{background:none;border:0;cursor:pointer;padding:0}
/* 패널 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel+.panel{margin-top:8px}.lead+.panel,.leads+.panel{margin-top:12px}.seg+.panel{margin-top:16px}.body>.panel:first-child{margin-top:4px}
/* 행 */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--div)}.row:first-child{border-top:0}
.row .c{font-size:var(--f1);color:var(--t3)}.row .t{font-size:var(--f3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t em{font-style:normal;font-weight:400;color:var(--t2)}
.row .r{display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}.row .v{font-size:var(--f3);font-weight:700}.row .vb{font-size:var(--f4);font-weight:700}
.row .tn{font-size:var(--f3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{min-width:0;flex:1}
.chev{color:var(--t3);font-size:var(--f3)}
.big2{font-size:var(--f5);font-weight:700}
/* 지표 그리드 */
.g2,.g3{display:grid}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.cell{padding:12px 14px;min-width:0}.g2 .cell:nth-child(n+3){border-top:1px solid var(--div)}.g2 .cell:nth-child(even),.g3 .cell+.cell{border-left:1px solid var(--div)}
.cell .l{font-size:var(--f1);color:var(--t3)}.cell .v{font-size:var(--f4);font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell .s{font-size:var(--f2);color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v.big{font-size:var(--f5)}
.g3 .cell{padding:12px 12px}
/* 흐름 행 */
.flow{padding:10px 14px 12px;border-top:1px solid var(--div)}.flow:first-child{border-top:0}
.flow .a{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.flow .a>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .t{font-size:var(--f3);font-weight:700}.flow .ph{font-size:var(--f2);font-weight:400;color:var(--t2);margin-left:8px}.flow .v{font-size:var(--f3);font-weight:700;white-space:nowrap}
.flow .sub{font-size:var(--f2);color:var(--t2);margin-top:2px}
.track{position:relative;height:6px;border-radius:3px;background:#EDF0F5;margin-top:8px}.track i{position:absolute}
.track .fill{top:0;height:6px;border-radius:3px;opacity:.3}.track .o,.track .d{top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%)}
.track .o{background:#fff;border:2px solid}.track .d{border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.flag{font-size:var(--f1);color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:6px 10px;margin-top:10px}
/* 점수 막대 행 */
.sb{display:grid;grid-template-columns:132px 1fr 60px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--div)}.sb:first-child{border-top:0}
.sb .n{font-size:var(--f2)}.sb .n small{display:block;font-size:var(--f1);color:var(--t2);margin-top:2px}.sb .sbar{height:6px;border-radius:3px;background:#EDF0F5;overflow:hidden}.sb .sbar i{display:block;height:6px;background:var(--acc);border-radius:3px}
.sb .v{text-align:right;font-size:var(--f3);font-weight:700;white-space:nowrap}.sb .v small{font-size:var(--f1);color:var(--t3);font-weight:400}
/* 상태 칩 목록 */
.cl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--div)}.cl:first-child{border-top:0}.cl>div{min-width:0;word-break:keep-all}
.chip{display:block;text-align:center;font-size:var(--f1);font-weight:700;border-radius:6px;padding:3px 0}
.chip.w{color:var(--warn);background:var(--warn-bg)}.chip.m{color:#374151;background:#EEF1F5}.chip.i{color:var(--acc);background:var(--acc-bg)}
.cl .t{font-size:var(--f2);font-weight:600;line-height:1.5}.cl .s{font-size:var(--f1);color:var(--t2);margin-top:2px}
.cl.one{align-items:center}.cl.one .t{display:flex;justify-content:space-between;gap:8px}.cl.one .t span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 순위 행 */
.rk{display:grid;grid-template-columns:16px minmax(0,1fr) 64px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--div)}.rk:first-child{border-top:0}
.rk .no{font-size:var(--f2);font-weight:700;color:var(--t3);text-align:center}.rk .t{font-size:var(--f3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk .t em{font-style:normal;font-weight:400;color:var(--t2);font-size:var(--f2)}
.rk .s{font-size:var(--f1);margin-top:2px}.rk .r{text-align:right}.rk .sc{font-size:var(--f4);font-weight:700}
.tag{font-size:var(--f1);font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}.tag.i{color:var(--acc);background:var(--acc-bg)}.tag.w{color:var(--warn);background:var(--warn-bg)}
.note{font-size:var(--f1);color:var(--t3);line-height:1.6;margin-top:12px;word-break:keep-all}
.flag{word-break:keep-all}
.g2.sum{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
#usb .panel{margin-top:8px}
.btn{display:block;width:100%;text-align:center;font-size:var(--f3);font-weight:700;color:var(--acc);padding:12px;background:none;border:0;cursor:pointer}
.btn:active{background:#F7F8FB}
/* 누름 */
[data-go],[data-act]{cursor:pointer}
.row[data-go]:active,.row[data-act]:active,.rk[data-go]:active,.flow[data-go]:active,.cl[data-go]:active,.cl[data-act]:active{background:#F7F8FB}
/* 근거 */
.kv .k{font-size:var(--f2);color:var(--t2)}.kv .v{font-size:var(--f3);font-weight:600}
.mk{display:inline-block;width:14px;text-align:center;font-size:var(--f2);font-weight:700}.mk.ok{color:var(--t1)}.mk.no{color:var(--warn)}
/* 불러오기 */
.ld{padding:6px 0}.ph{height:12px;margin:14px;border-radius:6px;background:#EDF0F5}.ph:nth-child(2n){width:60%}
/* 탭바 */
.bar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#fff;padding:8px 0 calc(14px + env(safe-area-inset-bottom));z-index:10}
.bar button{background:none;border:0;text-align:center;font-size:var(--f1);color:var(--t3);cursor:pointer;padding:0}
.bar svg{display:block;margin:0 auto 3px}.bar .on{color:var(--t1);font-weight:700}
body[data-detail] .bar{display:none}
/* 입력 */
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:var(--f3);background:#fff;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--acc)}
.lab{display:block;font-size:var(--f1);color:var(--t2)}.lab .inp{margin-top:4px}
.erow{padding:12px 14px;border-top:1px solid var(--div)}.erow:first-child{border-top:0}
.erow .t{font-size:var(--f3);font-weight:700}.erow .c{font-size:var(--f1);color:var(--t3);margin-top:2px}
.ef{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.pad{padding:12px 14px}
.unit{display:flex;align-items:center;gap:8px}.unit .inp{width:96px;text-align:right}
.lnk{background:none;border:0;font-size:var(--f1);color:var(--t3);cursor:pointer;padding:4px}
.foot{text-align:center;margin-top:20px}
/* 시트·토스트 */
.sheetw{position:fixed;inset:0;z-index:30}
.shbg{position:absolute;inset:0;background:rgba(17,24,39,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:#fff;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet b{font-size:var(--f4);font-weight:700}
.sheet textarea{display:block;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:var(--f3);line-height:1.5;resize:none;outline:none}
.sheet textarea:focus{border-color:var(--acc)}
.shb{display:flex;gap:8px;margin-top:12px}
.btn2{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:var(--f3);font-weight:700;cursor:pointer}
.btn2.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn2:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:rgba(17,24,39,.9);color:#fff;font-size:var(--f2);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<nav class="bar" id="bar">
 <button data-go="#/home" data-tab="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>홈</button>
 <button data-go="#/find" data-tab="find"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>발견</button>
 <button data-go="#/mine" data-tab="mine"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>내 종목</button>

</div>

<script>
'use strict';
// ═══════════════ 설정 ═══════════════
const DEFAULT_URL = 'https://rxaaouywglshpommdxnb.supabase.co';
const DEFAULT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4YWFvdXl3Z2xzaHBvbW1keG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTY5NjgsImV4cCI6MjA5ODU5Mjk2OH0.yTfqPgJTKBOQRCv7nh4f_oaFS7owQ6-uXEARTamf1xs';
const APP_VER = 'v9.2';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const CFG = (() => { const c = store.get('sa_cfg', {}); return c && typeof c === 'object' ? c : {}; })();
const SB_URL = CFG.url || DEFAULT_URL;
const SB_KEY = CFG.key || DEFAULT_KEY;
const MOCK = new URLSearchParams(location.search).get('mock');
let sb = null;
try { if (!MOCK && typeof supabase !== 'undefined') sb = supabase.createClient(SB_URL, SB_KEY); } catch (e) { sb = null; }

// ═══════════════ 형식 ═══════════════
const MINUS = '−';
const isN = x => typeof x === 'number' && Number.isFinite(x);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = s => encodeURIComponent(String(s ?? ''));
function loc(a, d) { return a.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
// 부호 없는 값(음수만 −)
function fN(x, d = 0) { if (!isN(x)) return ''; const a = Math.abs(x); const z = Number(a.toFixed(d)) === 0; return (x < 0 && !z ? MINUS : '') + loc(a, d); }
// 부호 붙인 값(0이면 부호 없음)
function sgn(v, d = 1) { if (!isN(v)) return ''; const a = Math.abs(v); if (Number(a.toFixed(d)) === 0) return loc(0, d); return (v > 0 ? '+' : MINUS) + loc(a, d); }
const pct = (x, d = 1) => isN(x) ? sgn(x * 100, d) + '%' : '';     // 비율 → %
const ppt = (x, d = 1) => isN(x) ? sgn(x * 100, d) + '%p' : '';    // 비율 → %p
const ppv = (v, d = 1) => isN(v) ? sgn(v, d) + '%p' : '';          // 이미 %p 단위
const cl1 = (v, d = 1) => { if (!isN(v)) return ''; const r = Number(v.toFixed(d)); return r > 0 ? 'up' : r < 0 ? 'dn' : ''; };
const clx = (x, d = 1) => isN(x) ? cl1(x * 100, d) : '';          // 비율의 색
const WD = ['일', '월', '화', '수', '목', '금', '토'];
function pd(s) { if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return { y, m, d, w: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; }
const dLong = s => { const p = pd(s); return p ? `${p.m}월 ${p.d}일(${WD[p.w]})` : ''; };
const dShort = s => { const p = pd(s); return p ? `${p.m}/${p.d}` : ''; };
const Z = p => !isN(p) ? '' : p >= 0.8 ? '고점권' : p <= 0.2 ? '저점권' : p >= 0.5 ? '중간 위' : '중간 아래';
const Zc = p => { const z = Z(p); return z === '고점권' || z === '저점권' ? '1년 ' + z : z; };
const PL = { '1M': '1개월', '3M': '3개월', '1Y': '1년' };
const pos100 = p => isN(p) ? Math.round(p * 100) + '%' : '';
const mean = a => { const v = a.filter(isN); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
function capUsd(x) { if (!isN(x) || x <= 0) return ''; if (x >= 1e12) return '$' + (x / 1e12).toFixed(2) + 'T'; if (x >= 1e10) return '$' + Math.round(x / 1e9) + 'B'; if (x >= 1e9) return '$' + (x / 1e9).toFixed(1) + 'B'; return '$' + Math.round(x / 1e6) + 'M'; }
function capKrw(x) { if (!isN(x) || x <= 0) return ''; if (x >= 1e12) return loc(x / 1e12, 1) + '조원'; return loc(Math.round(x / 1e8), 0) + '억원'; }

// ═══════════════ 상태 ═══════════════
const S = {
  market: ['US', 'KR'].includes(store.get('tikr_market', 'US')) ? store.get('tikr_market', 'US') : 'US',
  period: ['1M', '3M', '1Y'].includes(store.get('tikr_period', '3M')) ? store.get('tikr_period', '3M') : '3M',
  open: {}, pick: null, res: [], delArm: null, discTried: new Set(),
};
function getHoldings() {
  const a = store.get('tikr_holdings', []);
  if (!Array.isArray(a)) return [];
  return a.filter(h => h && (h.market === 'US' || h.market === 'KR') && typeof h.symbol === 'string' && h.symbol && isN(h.qty) && h.qty > 0)
    .map(h => ({ market: h.market, symbol: h.symbol, name: typeof h.name === 'string' ? h.name : '', bench: typeof h.bench === 'string' ? h.bench : '', qty: h.qty, avg: isN(h.avg) && h.avg > 0 ? h.avg : null }));
}
const setHoldings = a => { store.set('tikr_holdings', a); invalidate('mine'); };
function getRules() { const r = store.get('tikr_rules', {}); const w = r && isN(r.max_weight) ? r.max_weight : 30; return { max_weight: Math.min(100, Math.max(5, w)) }; }

// ═══════════════ 데이터 ═══════════════
const CACHE = new Map();
function invalidate(tag) { for (const k of [...CACHE.keys()]) if (!tag || k.startsWith(tag + ':')) CACHE.delete(k); }
async function cached(key, ttl, fn) {
  const c = CACHE.get(key);
  if (c && c.p) return c.p;
  if (c && Date.now() - c.t < ttl) return c.v;
  const p = (async () => fn())();
  CACHE.set(key, { p });
  try { const v = await p; CACHE.set(key, { t: Date.now(), v }); return v; }
  catch (e) { CACHE.delete(key); throw e; }
}
const peek = key => { const c = CACHE.get(key); return c && 'v' in c ? c.v : undefined; };
async function callRpc(fn, args) {
  if (MOCK) return mockRpc(fn, args);
  if (!sb) throw new Error('연결 실패');
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message || 'RPC 오류');
  return data;
}
const TTL = 10 * 60 * 1000;
// tag: 캐시 무효화 묶음(mine = 보유·관심이 바뀌면 다시)
function rpc(fn, args, tag = 'rpc') {
  return cached(`${tag}:${fn}:${JSON.stringify(args || {})}`, TTL, async () => {
    const d = await callRpc(fn, args);
    if (d && typeof d === 'object' && !Array.isArray(d) && d.error && !('ok' in d)) throw new Error(String(d.error));
    return d;
  });
}
async function fnPost(name, body) {
  if (MOCK) return mockFn(name, body);

  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
// 관심종목(서버 watchlist, 기존 형식: US 'MU'·nasdaq / KR '000660.KS'·kospi)
function wlParse(w) {
  const raw = String(w.symbol || ''); const mk = String(w.market || '').toLowerCase();
  const kr = /\.(KS|KQ)$/i.test(raw) || mk === 'kospi' || mk === 'kosdaq';
  const code = raw.replace(/\.(KS|KQ)$/i, '');
  return { market: kr ? 'KR' : 'US', symbol: kr ? code : raw.toUpperCase(), raw, bench: kr ? (/\.KQ$/i.test(raw) || mk === 'kosdaq' ? 'KOSDAQ' : 'KOSPI') : 'COMP' };
}
function watchlist() {
  return cached('mine:wl', TTL, async () => {
    if (MOCK) return (store.get('tikr_mock_wl', null) || [{ symbol: 'GEV', market: 'nasdaq' }]).map(wlParse);
    if (!sb) throw new Error('연결 실패');
    const { data, error } = await sb.from('watchlist').select('symbol,market,sort_order').order('sort_order', { ascending: true });
    if (error) throw new Error(error.message);
    return (data || []).map(wlParse).filter(w => w.symbol);
  });
}
const keyOf = x => x.market + ':' + x.symbol;
async function loadMine() {
  const H = getHoldings();
  const W = await watchlist().catch(() => []);
  const hk = new Set(H.map(keyOf));
  const watchOnly = W.filter(w => !hk.has(keyOf(w)));
  const items = H.map(h => ({ market: h.market, symbol: h.symbol })).concat(watchOnly.map(w => ({ market: w.market, symbol: w.symbol }))).slice(0, 60);
  const [hj, ps] = await Promise.all([
    items.length ? rpc('tikr_holdings_json', { p_items: items }, 'mine') : Promise.resolve(null),
    H.length ? rpc('tikr_portfolio_score_json', { p_holdings: H.map(h => ({ market: h.market, symbol: h.symbol, qty: h.qty })), p_n: 30 }, 'mine')
      .catch(e => ({ __err: e.message })) : Promise.resolve(null),
  ]);
  return { H, W, watchOnly, hj, ps, C: computeMine(H, hj) };
}
function computeMine(H, hj) {
  const by = {}; ((hj && hj.items) || []).forEach(x => { by[keyOf(x)] = x; });
  const fx = hj && hj.fx && isN(hj.fx.v) ? hj.fx.v : null;
  const fOf = m => m === 'US' ? fx : 1;
  const rows = H.map(h => {
    const it = by[keyOf(h)] || null; const px = it && it.px ? it.px : null; const f = fOf(h.market);
    const val = px && isN(px.v) && isN(f) ? h.qty * px.v * f : null;
    const pnl = isN(h.avg) && px && isN(px.v) ? px.v / h.avg - 1 : null;
    return { h, it, px, val, pnl, w: null };
  });
  const valued = rows.filter(x => isN(x.val));
  const total = valued.reduce((s, x) => s + x.val, 0);
  rows.forEach(x => { x.w = isN(x.val) && total > 0 ? x.val / total : null; });
  let tp = null;
  if (rows.length && rows.every(x => isN(x.h.avg) && isN(x.val))) {
    const cost = rows.reduce((s, x) => s + x.h.qty * x.h.avg * fOf(x.h.market), 0);
    const gain = rows.reduce((s, x) => s + x.h.qty * (x.px.v - x.h.avg) * fOf(x.h.market), 0);
    tp = cost > 0 ? gain / cost : null;
  }
  return { rows, total: valued.length ? total : null, tp, fx, by };
}
function nameOf(by, h) {
  const it = by && by[keyOf(h)];

}

function keyReason(x) {
  const c = [['p3x', 0.40, () => ['3M 초과 ' + ppt(x.r3x), x.r3x]], ['p1x', 0.25, () => ['1M 초과 ' + ppt(x.r1x), x.r1x]], ['py', 0.15, () => ['1Y ' + pct(x.y), x.y]],
    ['pv_eff', 0.20, () => [isN(x.v) ? '거래대금 ' + x.v.toFixed(1) + '배' : '', isN(x.v) ? x.v - 1 : null]]];
  let best = null, bw = -1;
  for (const [f, w, g] of c) if (isN(x[f]) && x[f] * w > bw) { bw = x[f] * w; best = g; }
  if (!best) return null;
  const [t, v] = best();
  if (!t || /\s$/.test(t)) return null;
  return { t, c: isN(v) ? (v > 0 ? 'up' : v < 0 ? 'dn' : '') : '' };
}

let searchTimer = null, searchSeq = 0;
async function runSearch(q) {
  const my = ++searchSeq;

  if (!q) { box.innerHTML = ''; S.res = []; return; }
  const [a, b] = await Promise.all([
    callRpc('tikr_search_json', { p_q: q }).catch(() => []),
    q.length >= 2 ? fnPost('stock-search', { query: q }).then(j => (j && Array.isArray(j.items)) ? j.items : []).catch(() => []) : Promise.resolve([]),
  ]);
  if (my !== searchSeq || !document.getElementById('res')) return;
  const out = []; const seen = new Set();
  for (const x of (Array.isArray(a) ? a : [])) {
    if (!x || !x.symbol || (x.market !== 'US' && x.market !== 'KR')) continue;
    const k = x.market + ':' + x.symbol; if (seen.has(k)) continue; seen.add(k);
    out.push({ market: x.market, symbol: x.symbol, name: x.name || '', bench: x.bench || (x.market === 'US' ? 'COMP' : '') });
  }
  for (const x of b) {
    if (!x || typeof x.symbol !== 'string') continue;
    const kr = /^[0-9A-Z]{6}\.(KS|KQ)$/i.test(x.symbol);
    const it = kr ? { market: 'KR', symbol: x.symbol.slice(0, 6).toUpperCase(), name: x.name || '', bench: /\.KQ$/i.test(x.symbol) ? 'KOSDAQ' : 'KOSPI' }
                  : { market: 'US', symbol: x.symbol.toUpperCase(), name: x.name || '', bench: 'COMP' };
    if (it.market === 'US' && !/^[A-Z][A-Z0-9]{0,5}([./][A-Z])?$/.test(it.symbol)) continue;
    const k = it.market + ':' + it.symbol; if (seen.has(k)) continue; seen.add(k); out.push(it);
  }
  S.res = out.slice(0, 20);
  box.innerHTML = S.res.length ? S.res.map((x, i) => `<div class="row" data-act="pick" data-i="${i}"><div class="mid"><div class="t">${esc(x.name || x.symbol)}</div><div class="c">${esc(x.symbol)} · ${mkLabel(x)}</div></div><span class="chev">›</span></div>`).join('')

}

const parseNum = s => { const t = String(s ?? '').replace(/,/g, '').trim(); if (t === '') return null; if (!/^\d+(\.\d+)?$/.test(t)) return NaN; return Number(t); };
async function addPick(btn) {

  const a = el.dataset.act;
